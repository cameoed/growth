[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "beings-leads"
version = "0.2.0"
description = "Beings Growth company research and prospecting"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "openai>=1.68,<3",
  "pypdf>=5.9,<7",
  "pydantic>=2.8,<3",
  "tldextract>=5.1,<6",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
beings-leads = "beings_leads.cli:main"
beings-dashboard = "beings_leads.web:main"
beings-growth = "beings_leads.web:launch_in_browser"

[tool.hatch.build.targets.wheel]
packages = ["src/beings_leads"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
